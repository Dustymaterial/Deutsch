services:
  - type: web
    name: deutsch-daily-deck
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
